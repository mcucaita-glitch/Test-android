name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake \
            libtool libtool-bin m4 pkg-config zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev
          pip install buildozer "cython<3"

      - name: Build
        run: buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: bin/*.apk
